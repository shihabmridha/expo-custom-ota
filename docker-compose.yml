# Two containers built from the same root Dockerfile via its `backend` and
# `dashboard` targets: nginx serves the SPA and terminates the client
# connection, proxying /api and /health through to the backend on the
# private compose network. Point a reverse proxy / TLS terminator at the
# `dashboard` service in production; nothing here binds to a public IP.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - '3000:3000'
    environment:
      OTA_PUBLIC_URL: ${OTA_PUBLIC_URL:?set OTA_PUBLIC_URL, e.g. https://ota.example.com}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET to a random string of 32+ characters}
      DATABASE_URL: ${DATABASE_URL:-file:/data/ota.db}
      # The backend always sits behind the dashboard's nginx container in
      # this topology, so trust its X-Forwarded-* headers for client IP /
      # protocol detection.
      TRUST_PROXY: 'true'
    volumes:
      - ota-data:/data
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: dashboard
    ports:
      - '80:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ota-data:
