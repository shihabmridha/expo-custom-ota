services:
  oat:
    build: .
    ports:
      - '3000:3000'
    environment:
      # Baked into signed manifests as the asset URL prefix — changing it after
      # publishing invalidates existing manifests. Set it correctly first.
      OTA_PUBLIC_URL: ${OTA_PUBLIC_URL:?set OTA_PUBLIC_URL, e.g. https://ota.example.com}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET to a random string of 32+ characters}

      # Local libSQL + filesystem storage by default. For Turso, set
      # DATABASE_URL=libsql://... and DATABASE_AUTH_TOKEN. For R2, set
      # STORAGE_DRIVER=r2 and the R2_* variables.
      DATABASE_URL: ${DATABASE_URL:-file:/data/ota.db}
      DATABASE_AUTH_TOKEN: ${DATABASE_AUTH_TOKEN:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    volumes:
      # Holds the libSQL file, asset objects and — critically — the private
      # signing keys. Losing this volume means every app must be re-signed and
      # every installed binary re-released.
      - ota-data:/data
    restart: unless-stopped

volumes:
  ota-data:
